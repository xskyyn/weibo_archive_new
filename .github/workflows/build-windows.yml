name: build-windows-exe

# 触发方式：手动 / 推送 v* 标签 / 推送到 main
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "requirements.txt"
      - "webo_archive.spec"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node (前端构建)
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 安装后端与打包依赖
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 运行 PyInstaller
        run: pyinstaller --clean --noconfirm webo_archive.spec

      - name: 生成免安装绿色版
        shell: powershell
        run: |
          if (Test-Path dist\WeiboArchive.exe) {
            Compress-Archive -Path dist\WeiboArchive.exe -DestinationPath dist\WeiboArchive-portable.zip -Force
          }

      - name: 上传产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: WeiboArchive-win
          path: |
            dist/WeiboArchive.exe
            dist/WeiboArchive-portable.zip
          if-no-files-found: error

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WeiboArchive.exe
            dist/WeiboArchive-portable.zip